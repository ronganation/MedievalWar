schema_contract:
  principle: UniformImplementationGrammarFlexibleHistoricExpression
  independent_axes:
  - MilitaryQuality
  - RecruitmentProvider
  - ProviderDevelopment
  - RecruitmentQualifier
  - RecruitmentPool
  - EraAndProgression
  - BattleRole
  - VisualizationRelationship
  quality_is_power_ranking: false
  provider_is_quality_ranking: false
  provider_development_is_settlement_level: false
  quality_overrides_battle_role: false
  quality_does_not_override_battle_role: true
  provider_class_grants_access: false
  building_or_calendar_or_research_creates_complete_unit: false
  one_provider_per_unit_required: false
  one_quality_per_provider_required: false
  finite_pool_accounting_required: true
  same_inputs_double_counted: false
  same_inputs_double_counting_prohibited: true
  arbitrary_global_cap_default: false
  survivors_persist_after_recruitment_closure: true
  provider_pool_owner_controller_and_settlement_separate: true
  no_fictitious_card_for_support_capability: true
  pool_capacity_access_and_recovery_are_orthogonal: true
identifier_contract:
  candidate_ids_are_runtime_ids: false
  shared_id_pattern: ^[A-Z][A-Z0-9]*\.[A-Z][A-Za-z0-9]*$
  realm_id_pattern: ^[A-Za-z][A-Za-z0-9._-]*$
  prefixes:
    MQG: MilitaryQualityGroup
    MQS: MilitaryQualitySubgroup
    RPC: RecruitmentProviderClass
    PDS: ProviderDevelopmentState
    RQC: RecruitmentQualifierClass
    RPCS: RecruitmentPoolClass
    MPS: MilitaryPoolState
    ACS: AccessChannelType
    ORS: OpeningStatus
    PERA: PublicEra
    PEM: ProgressionEmergenceMode
    VRT: VisualRelationshipType
    APS: ApplicabilityScope
  rules:
  - ASCIIOnly
  - PascalCaseAfterPrefix
  - NoMutableDisplayNameInSemanticID
  - NoTemporaryPathOrNumericBalanceValueInID
  - NoDuplicateSemanticID
  - AliasChangeDoesNotChangeID
  - DeprecationRequiresDisposition
unknown_and_null_policy:
  unresolved_token: Unresolved
  pending_review_token: PendingReview
  not_applicable_token: NotApplicable
  null_allowed_only_for_truly_inapplicable_fields: true
  unknown_must_not_use_null: true
  empty_string_prohibited: true
  optional_arrays_default: []
  invented_runtime_guid_prohibited: true
