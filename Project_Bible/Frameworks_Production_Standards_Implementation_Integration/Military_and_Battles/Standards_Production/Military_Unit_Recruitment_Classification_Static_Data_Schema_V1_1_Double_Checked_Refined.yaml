  weakness_tags: ZeroOrMore
record_lifecycle_contract:
  stages:
    StaticReviewOnly:
      record: military_unit_recruitment_classification_record
      bindings: ZeroOrMore
      zero_binding_condition: BindingResolutionStatusIsUnresolvedPendingReviewOrHeldFromActivation
      permits_activation: false
      creates_live_pool: false
    ActivationReady:
      record: military_unit_recruitment_classification_record
      bindings: OneOrMoreValidNamedProviderBindings
      access_channels: OneOrMoreSeparatelyAuthorizedChannels
      permits_activation_without_owner_authorization: false
      creates_live_pool: false
    LivePool:
      record: finite_recruitment_pool_record
      bindings: OneOrMoreValidNamedProviderBindings
      access_channels: OneOrMoreSeparatelyAuthorizedChannels
      unresolved_binding_or_access_satisfies_requirement: false
      requires_separate_owner_authorization: true
