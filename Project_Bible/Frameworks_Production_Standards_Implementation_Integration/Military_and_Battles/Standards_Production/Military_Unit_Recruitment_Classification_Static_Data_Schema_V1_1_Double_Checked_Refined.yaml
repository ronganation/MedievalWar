cross_field_validation_contract:
  quality_subgroup_parent_must_equal_quality_group: true
  static_review_only_zero_bindings_require_unresolved_pending_review_or_hold: true
  activation_ready_requires_one_or_more_valid_named_provider_bindings: true
  live_pool_requires_one_or_more_valid_named_provider_bindings: true
  live_pool_requires_one_or_more_separately_authorized_access_channels: true
  unresolved_never_satisfies_live_binding_or_access: true
  canonical_pool_owner_must_remain_distinctly_addressable: true
  controller_and_settlement_host_must_remain_distinctly_addressable: true
  pool_capacity_access_and_recovery_are_independent_axes: true
  no_mutually_exclusive_single_pool_state_field: true
  non_card_scope_must_not_create_recruitable_unit_record: true
  mercenary_scope_requires_contract_provider_and_source_binding: true
  military_order_scope_requires_order_provider_or_explicit_external_authority: true
  naval_combat_scope_requires_combat_card_evidence: true
  transport_capacity_alone_must_not_create_combat_card: true
  opening_status_does_not_authorize_opening_state_mutation: true
  candidate_registry_status_does_not_authorize_runtime_use: true
  unresolved_token_must_not_satisfy_live_binding_requirement: true
  same_overlap_group_must_not_be_counted_twice: true
  survivor_persistence_must_not_reopen_new_recruitment: true
  candidate_registry_entries_must_not_be_treated_as_confirmed_runtime_bindings: true
  all_mutation_and_activation_flags_must_remain_false: true
  conditional_assertions:
  - id: StaticReviewOnlyZeroBindingGate
    when: lifecycle_stage == StaticReviewOnly AND provider.named_provider_binding_ids.count == 0
    require: provider.binding_resolution_status IN [Unresolved, PendingReview, HeldFromActivation]
    forbid: runtime_or_opening_activation
  - id: ActivationReadyBindingGate
    when: lifecycle_stage == ActivationReady
    require: provider.named_provider_binding_ids.count >= 1 AND every_binding_is_valid
    require_all_bindings: source_status == ConfirmedStaticCandidate
    require_all_access: at_least_one_named_binding.access_channel_ids.count >= 1 AND at_least_one_named_binding.access_channel_authorization_status == Authorized
    forbid: unresolved_binding_or_candidate_registry_entry_as_runtime_confirmation
  - id: LivePoolBindingAndAccessGate
    when: record_type == finite_recruitment_pool_record AND lifecycle_stage == LivePool
    require: named_provider_binding_ids.count >= 1 AND every_binding_is_valid
    require_all_access: access_channel_ids.count >= 1 AND access_channel_authorization_status == Authorized
    forbid: Unresolved
  - id: NonCardScopeGate
    when: applicability_scope_id IN non_card_scopes
    require: no_recruitable_unit_family_record
  - id: MercenarySourceGate
    when: applicability_scope_id == APS.MercenaryUnitFamily
    require: RPC.ContractMercenary IN provider.primary_class_ids OR provider.secondary_class_ids
    require_all_bindings: named_source_ref_is_resolved AND contract_source_evidence_exists
    require_all_access: ACS.MercenaryContract_is_authorized
  - id: MilitaryOrderProviderGate
    when: applicability_scope_id == APS.MilitaryOrderUnitFamily
    require: RPC.MilitaryOrder IN provider.primary_class_ids OR provider.secondary_class_ids OR explicit_external_authority_ref_exists
  - id: NavalCombatCardEvidenceGate
    when: applicability_scope_id == APS.RecruitableNavalCombatUnitFamily
    require: battle.combat_card_evidence_refs.count >= 1
  - id: TransportOnlyGate
    when: applicability_scope_id == APS.TransportCapacityWithoutCombatCard
    require: no_recruitable_unit_family_record AND no_combat_card
  - id: ProviderOwnershipSeparationGate
    when: every_named_provider_binding
    require: provider_source_ref AND canonical_pool_owner_ref_are_separately_addressable
    require_all_bindings: controller_ref AND settlement_host_ref_remain_separately_addressable_even_if_same_entity
  - id: NoDoubleCountingGate
    when: pools_share_reserved_people_horses_equipment_leaders_or_crews
    require: shared_inputs_debited_once_across_overlap_groups
  - id: SurvivorPersistenceGate
    when: new_recruitment_is_closed
    require: survivor_persistence_may_continue
    forbid: survivor_persistence_reopens_new_recruitment
  - id: CandidateRegistryGate
    when: shared_registry_entry.adoption_status == Candidate
    forbid: candidate_entry_treated_as_confirmed_runtime_binding
  - id: NonactivationGate
    when: every_schema_record
    require: all_seven_authorization_flags == false

